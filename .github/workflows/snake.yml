name: generate animation

on:
  # запускати автоматично кожні 24 години
  schedule:
    - cron: "0 */24 * * *"

  # дозволити запускати вручну в будь-який час
  workflow_dispatch:

  # запускати при кожному push у гілку main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # генерує змійку з контріб'юторів користувача (<github_user_name>)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # завантажує вміст <build_dir> у гілку 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
